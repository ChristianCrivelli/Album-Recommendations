name: Fix Suspicious Artist Matches (one-off)

on:
  workflow_dispatch: # Manual trigger only — this is a one-off data-remediation job,
                      # not part of the regular pipeline schedule.

jobs:
  fix-suspicious-artists:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Re-check and fix the 113 confirmed wrong-artist matches
      env:
        email: ${{ secrets.EMAIL }}
        supabase_url: ${{ secrets.SUPABASE_URL }}
        supabase_key: ${{ secrets.SUPABASE_KEY }}
      run: |
        python -m ingestion.fix_suspicious_artists
