name: Deep Sync Album Pipeline

on:
  schedule:
    # Runs at 05:00 AM UTC on the 1st of every month
    - cron: '0 5 1 * *'
  workflow_dispatch: # Allows you to also trigger it manually from the GitHub website

jobs:
  deep-sync:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code from GitHub onto the cloud runner
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with-version: '3.11'
        cache: 'pip' # Automatically caches your packages for faster subsequent runs

    # 3. Install all dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute the pipeline with a forced full rebuild
    # We pass the GitHub secrets into the runner's environment variables
    - name: Run Python script (full rebuild)
      env:
        notion_key: ${{ secrets.NOTION_KEY }}
        database_id: ${{ secrets.DATABASE_ID }}
        spotify_key: ${{ secrets.SPOTIFY_KEY }}
        spotify_id: ${{ secrets.SPOTIFY_ID }}
        email: ${{ secrets.EMAIL }}
        supabase_url: ${{ secrets.SUPABASE_URL }}
        supabase_key: ${{ secrets.SUPABASE_KEY }}
        FULL_SYNC: "true"
      run: |
        python -m ingestion.album_push_logic
